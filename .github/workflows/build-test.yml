name: Autobahn WebSocket Conformance

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: autobahn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autobahn:
    name: Autobahn (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend:
          - netty
          - pekko-http

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Coursier cache
        uses: coursier/cache-action@v8

      - name: Install Adoptium Temurin OpenJDK
        uses: coursier/setup-action@v3
        with:
          jvm: adoptium:17

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Run Autobahn core profile
        run: core/play-integration-test/autobahn/run.sh "${{ matrix.backend }}" core

      - name: Upload Autobahn report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobahn-${{ matrix.backend }}-core
          path: target/autobahn/${{ matrix.backend }}/core
          if-no-files-found: warn
          retention-days: 7
